run-name: Test CyberArk Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  cyberark-integration:
    permissions:
      id-token: 'write'
      contents: 'read'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Import Secrets using CyberArk Conjur Secret Fetcher
        uses: cyberark/conjur-action@v2.0.6
        with:
          url: https://demo.secretsmgr.cyberark.cloud/api
          account: conjur
          authn_id: github_sa
          # Removed the pipe alias mapping to bypass internal plugin parsing bugs
          secrets: data/vault/cyberarkshop-automation-demo/cyberarkshop-trust-anchor/password

      - name: Save PEM Certificate to File and Verify
        run: |
          cat << 'EOF' > trust-anchor.pem
          ${{ env.PASSWORD }}
          EOF
          if [ -s trust-anchor.pem ]; then
            echo "Success: trust-anchor.pem created successfully."
            openssl x509 -in trust-anchor.pem -text -noout | grep -E "Issuer:|Subject:|Not After :"
          else
            echo "Error: Certificate file is empty. Conjur did not return data."
            exit 1
          fi
